# NIM on GKE Autopilot, following the "Deploy Faster Generative AI Models with
# NVIDIA NIM on GKE" pathway. One pod, one L4, no external exposure.
#
#   kubectl create secret docker-registry ngc-secret \
#     --docker-server=nvcr.io --docker-username='$oauthtoken' \
#     --docker-password="$NGC_API_KEY"
#   kubectl create secret generic ngc-api --from-literal=NGC_API_KEY="$NGC_API_KEY"
#   kubectl apply -f deploy/nim-l4.yaml
#
# The service is ClusterIP on purpose. A NIM speaks an unauthenticated
# OpenAI-compatible API; giving it a public address would put an open inference
# endpoint on the internet to save one port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nim
  labels: {app: nim}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nim}
  template:
    metadata:
      labels: {app: nim}
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      imagePullSecrets:
        - name: ngc-secret
      containers:
        - name: nim
          image: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2:latest
          ports:
            - containerPort: 8000
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef: {name: ngc-api, key: NGC_API_KEY}
            - name: NIM_CACHE_PATH
              value: /model-cache
          resources:
            # The model download is roughly 18 GB; Autopilot's default
            # ephemeral storage is nowhere near that, so it is requested.
            requests:
              cpu: "6"
              memory: 24Gi
              ephemeral-storage: 60Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 24Gi
              ephemeral-storage: 60Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache}
            - {name: dshm, mountPath: /dev/shm}
          readinessProbe:
            httpGet: {path: /v1/health/ready, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 80
      volumes:
        - name: model-cache
          emptyDir: {sizeLimit: 60Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: nim
spec:
  type: ClusterIP
  selector: {app: nim}
  ports:
    - {port: 8000, targetPort: 8000}
